# setup.sh 가 __PORT__ 를 채움 (80/443은 4단계 kind 클러스터가 사용)
server {
    listen __PORT__;
    listen [::]:__PORT__;
    server_name _;

    root /var/www/todo;
    index index.html;

    # API 요청은 Node.js(3000)로 전달. /api 접두사는 그대로 넘긴다.
    location /api/ {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    # 그 밖은 React 정적 파일
    location / {
        try_files $uri $uri/ /index.html;
    }
}
