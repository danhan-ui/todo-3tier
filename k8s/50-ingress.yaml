# host 없음 → http://localhost/ 로 접속. /api 는 api, 나머지는 web
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: todo
  namespace: todo-3tier
spec:
  ingressClassName: traefik
  rules:
    - http:
        paths:
          - path: /api
            pathType: Prefix
            backend:
              service:
                name: api
                port: { number: 3000 }
          - path: /
            pathType: Prefix
            backend:
              service:
                name: web
                port: { number: 80 }
