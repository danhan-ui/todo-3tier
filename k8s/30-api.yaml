apiVersion: apps/v1
kind: Deployment
metadata:
  name: api
  namespace: todo-3tier
spec:
  replicas: 1
  selector:
    matchLabels: { app: api }
  template:
    metadata:
      labels: { app: api }
    spec:
      containers:
        - name: api
          image: todo-api:1.0          # kind load docker-image 로 넣은 이미지
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 3000
          envFrom:
            - configMapRef: { name: todo-config }
            - secretRef: { name: todo-db }
          readinessProbe:
            httpGet: { path: /api/health, port: 3000 }
            periodSeconds: 5
          resources:
            requests: { cpu: 50m, memory: 64Mi }
            limits: { memory: 256Mi }
---
apiVersion: v1
kind: Service
metadata:
  name: api
  namespace: todo-3tier
spec:
  selector: { app: api }
  ports:
    - port: 3000
      targetPort: 3000
