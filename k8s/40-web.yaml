apiVersion: apps/v1
kind: Deployment
metadata:
  name: web
  namespace: todo-3tier
spec:
  replicas: 1
  selector:
    matchLabels: { app: web }
  template:
    metadata:
      labels: { app: web }
    spec:
      containers:
        - name: web
          image: todo-web:1.0          # kind load docker-image 로 넣은 이미지
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 80
          readinessProbe:
            httpGet: { path: /, port: 80 }
            periodSeconds: 5
          resources:
            requests: { cpu: 20m, memory: 32Mi }
            limits: { memory: 128Mi }
---
apiVersion: v1
kind: Service
metadata:
  name: web
  namespace: todo-3tier
spec:
  selector: { app: web }
  ports:
    - port: 80
      targetPort: 80
